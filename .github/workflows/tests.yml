name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pyproject.toml's pytest addopts use --cov, so pytest-cov is required
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Run tests
        run: pytest

      - name: Run example
        run: |
          python -c "
          import examples.example_adoption as ex
          ex.plot_results = lambda curves: None
          ex.run_example()
          "
